function render(){const nav=document.getElementById('unitNav'),content=document.getElementById('content');UNITS.forEach(u=>{const b=document.createElement('button');b.className='unit-btn';b.dataset.unit=u.n;b.textContent=u.n;b.title=unitLabel(u);b.onclick=()=>show(u.n);nav.appendChild(b);const a=document.createElement('article');a.className='unit';a.dataset.unit=u.n;a.innerHTML='<div class="unit-head"><div class="kicker">'+esc(unitLabel(u))+'</div><h2>原始試卷 · 第 '+u.n+' 頁</h2></div><div class="workspace"><section class="paper"><div class="zoom"><button data-zoom="out">− 縮小</button><button data-zoom="fit">符合寬度</button><button data-zoom="in">＋ 放大</button></div><img class="page-img" src="'+u.page+'" alt="'+esc(unitLabel(u)+' original worksheet page')+'"></section><aside class="answers"><h3>作答區</h3><div class="answer-note">題目與選項請查看左側原卷；答案在提交前不會顯示。</div><div class="answer-list">'+u.questions.map(x=>answerHTML(u,x)).join('')+'</div><div class="actions"><button class="action submit" data-submit>提交本單元</button><button class="action reset" data-reset>重做</button><button class="action next" data-next>下一單元 →</button><div class="score" id="score-'+u.n+'"></div></div><div class="source-note">來源：原始 worksheet PDF，第 '+u.n+' 頁。</div></aside></div>';content.appendChild(a)});bind();show(state.active||1,false);restore();updateProgress()}
function answerHTML(u,x){const k=u.n+'-'+x.n;if(x.type==='choice')return '<div class="answer-row" data-key="'+k+'"><span class="qnum">'+x.n+'</span><span>選擇答案</span><div class="letters">'+x.choices.map(c=>'<span class="letter"><input type="radio" name="q'+k+'" id="q'+k+c+'" value="'+c+'"><label for="q'+k+c+'">'+c+'</label></span>').join('')+'</div><div class="feedback"></div></div>';return '<div class="answer-row" data-key="'+k+'"><span class="qnum">'+x.n+'</span><span>填寫答案</span><input class="text" aria-label="Question '+x.n+' answer" autocomplete="off" spellcheck="false"><div class="feedback"></div></div>'}
function bind(){document.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=()=>{state.answers[x.closest('.answer-row').dataset.key]=x.value;save()});document.querySelectorAll('.text').forEach(x=>x.oninput=()=>{state.answers[x.closest('.answer-row').dataset.key]=x.value;save()});document.querySelectorAll('.unit').forEach(a=>{a.querySelector('[data-submit]').onclick=()=>submit(+a.dataset.unit);a.querySelector('[data-reset]').onclick=()=>reset(+a.dataset.unit);a.querySelector('[data-next]').onclick=()=>show(Math.min(UNITS.length,+a.dataset.unit+1));let scale=1;a.querySelector('[data-zoom="in"]').onclick=()=>zoom(a,scale=Math.min(2,scale+.15));a.querySelector('[data-zoom="out"]').onclick=()=>zoom(a,scale=Math.max(.65,scale-.15));a.querySelector('[data-zoom="fit"]').onclick=()=>zoom(a,scale=1)})}
function zoom(a,s){const img=a.querySelector('.page-img');img.style.width=(s*100)+'%';img.style.maxWidth='none'}function show(n,scroll=true){state.active=n;document.querySelectorAll('.unit').forEach(x=>x.classList.toggle('active',+x.dataset.unit===n));document.querySelectorAll('.unit-btn').forEach(x=>x.classList.toggle('active',+x.dataset.unit===n));save();if(scroll)document.querySelector('.main').scrollIntoView({behavior:'smooth'})}
function restore(){for(const[k,v]of Object.entries(state.answers||{})){const r=document.querySelector('.answer-row[data-key="'+k+'"]');if(!r)continue;const radio=r.querySelector('input[type=radio][value="'+CSS.escape(v)+'"]');if(radio)radio.checked=true;const input=r.querySelector('.text');if(input)input.value=v}Object.keys(state.submitted||{}).forEach(n=>{if(state.submitted[n])grade(+n,false)})}
function ok(x,v){if(x.type==='choice')return v===x.answer;return [x.answer,...x.accepted].map(norm).includes(norm(v))}function submit(n){state.submitted[n]=true;grade(n,true);save()}function grade(n,announce){const u=UNITS[n-1];let good=0;u.questions.forEach(x=>{const r=document.querySelector('.answer-row[data-key="'+n+'-'+x.n+'"]'),v=state.answers[n+'-'+x.n]||'',yes=ok(x,v);if(yes)good++;r.classList.remove('correct','wrong');r.classList.add(yes?'correct':'wrong');r.querySelectorAll('input').forEach(i=>i.disabled=true);r.querySelector('.feedback').textContent=yes?'✓ 正確':'正確答案：'+x.answer});document.getElementById('score-'+n).textContent='得分 '+good+' / '+u.questions.length;document.querySelector('.unit-btn[data-unit="'+n+'"]').classList.add('done');if(announce)toast('本單元已批改：'+good+' / '+u.questions.length)}
function reset(n){if(!confirm('確定要清除本單元的作答與分數嗎？'))return;const u=UNITS[n-1];u.questions.forEach(x=>delete state.answers[n+'-'+x.n]);delete state.submitted[n];const a=document.querySelector('.unit[data-unit="'+n+'"]');a.querySelectorAll('input').forEach(i=>{i.disabled=false;i.type==='radio'?i.checked=false:i.value=''});a.querySelectorAll('.answer-row').forEach(r=>r.classList.remove('correct','wrong'));a.querySelectorAll('.feedback').forEach(f=>f.textContent='');document.getElementById('score-'+n).textContent='';document.querySelector('.unit-btn[data-unit="'+n+'"]').classList.remove('done');save()}
