<script>const UNITS=[{"n":1,"title":"The Happy Prince","meta":"pp. 10–13 · October 1–2, 2026","sections":[{"title":"一、字彙","questions":[{"n":1,"prompt":"The man and the woman promised to love and respect each other _____.","options":{"A":"forever","B":"jewels","C":"precious","D":"details","E":"fake"},"answer":"A","type":"choice"},{"n":2,"prompt":"These are photos of my mother in her youth, and they are _____ to me.","options":{"A":"forever","B":"jewels","C":"precious","D":"details","E":"fake"},"answer":"C","type":"choice"},{"n":3,"prompt":"Judith owns several beautiful _____, and she keeps them in a safe.","options":{"A":"forever","B":"jewels","C":"precious","D":"details","E":"fake"},"answer":"B","type":"choice"},{"n":4,"prompt":"The workers s_____ped away the old paint from the wall.","answer":"stripped","accepted":[],"type":"text"},{"n":5,"prompt":"A lack of rain caused poor harvests, leading to widespread h____r.","answer":"hunger","accepted":[],"type":"text"},{"n":6,"prompt":"Elizabeth is one of many servants who work in the p____e.","answer":"palace","accepted":[],"type":"text"}]},{"title":"二、文意選填","questions":[{"n":7,"prompt":"There was a ruby on the handle of the prince’s __(7)__.","options":{"A":"filled","B":"sword","C":"joyful","D":"noticed","E":"suffering"},"answer":"B","type":"choice"},{"n":8,"prompt":"The bird __(8)__ that the prince was crying.","options":{"A":"filled","B":"sword","C":"joyful","D":"noticed","E":"suffering"},"answer":"D","type":"choice"},{"n":9,"prompt":"The prince danced and was __(9)__ every day when alive.","options":{"A":"filled","B":"sword","C":"joyful","D":"noticed","E":"suffering"},"answer":"C","type":"choice"},{"n":10,"prompt":"Now he could see __(10)__ everywhere in the city.","options":{"A":"filled","B":"sword","C":"joyful","D":"noticed","E":"suffering"},"answer":"E","type":"choice"},{"n":11,"prompt":"The troubles of the poor __(11)__ his lead heart with sorrow.","options":{"A":"filled","B":"sword","C":"joyful","D":"noticed","E":"suffering"},"answer":"A","type":"choice"}],"passage":"A gold-covered statue of the Happy Prince stood above a European city. A swallow learned that the prince had known only joy while alive, but from his high position the statue could now see the suffering of poor people everywhere."},{"title":"三、閱讀測驗","questions":[{"n":12,"prompt":"What was the angel instructed to do?","options":{"A":"Return the statue to its original place.","B":"Bring back the two most important things.","C":"Fix the prince’s broken lead heart.","D":"Help the swallow on its mission."},"answer":"B","type":"choice"},{"n":13,"prompt":"Why was the statue taken away in the end?","options":{"A":"It was damaged by cold weather.","B":"It was no longer special or attractive.","C":"God ordered its removal.","D":"Another statue had been made."},"answer":"B","type":"choice"},{"n":14,"prompt":"What is the main lesson of the story?","options":{"A":"High status is important.","B":"Everyone must face death.","C":"Kindness is the greatest treasure.","D":"Wealth brings true happiness."},"answer":"C","type":"choice"}],"passage":"The prince and swallow gave the statue’s ruby, sapphire eyes, and gold to people in need. The swallow died in winter and the prince’s heart broke. Although the stripped statue was discarded, God judged the swallow and the prince’s heart to be the city’s two most valuable things."},{"title":"四、翻譯填空","questions":[{"n":15,"prompt":"一個解決方式是雇用更多員工，而另外一個是將我們的軟體升級。\n_____ solution is to hire more staff, and _____ is to upgrade our software.","answer":"One; another","accepted":["one another"],"type":"text"},{"n":16,"prompt":"John 親自把包裹送給 Amber。\nJohn personally _____ the package _____ Amber.","answer":"delivered; to","accepted":["delivered to"],"type":"text"}]}]},{"n":2,"title":"From Military Uniforms to Everyday Style","meta":"pp. 14–17 · October 5–6, 2026","sections":[{"title":"一、字彙","questions":[{"n":1,"prompt":"Bill loved the ocean as a child, and that’s why he joined the _____.","options":{"A":"statue","B":"hunger","C":"navy","D":"angel"},"answer":"C","type":"choice"},{"n":2,"prompt":"These trousers are too _____; I need a smaller size.","options":{"A":"loose","B":"joyful","C":"moist","D":"obedient"},"answer":"A","type":"choice"},{"n":3,"prompt":"If you want _____ cheese on your spaghetti, let me know.","options":{"A":"pleasant","B":"initial","C":"major","D":"extra"},"answer":"D","type":"choice"},{"n":4,"prompt":"The team has made _____ progress on the project.","options":{"A":"precious","B":"significant","C":"sticky","D":"jealous"},"answer":"B","type":"choice"},{"n":5,"prompt":"Watson has a strong interest in the m______y history of his homeland.","answer":"military","accepted":[],"type":"text"},{"n":6,"prompt":"The building was o________y a warehouse before becoming a museum.","answer":"originally","accepted":[],"type":"text"}]},{"title":"二、克漏字","questions":[{"n":7,"prompt":"The bomber jacket was made for pilots __(7)__ cockpits were open and cold.","options":{"A":"that","B":"when","C":"until","D":"unless"},"answer":"B","type":"choice"},{"n":8,"prompt":"Around 1950, the US Air Force __(8)__ the MA-1 jacket.","options":{"A":"stripped","B":"amazed","C":"threatened","D":"introduced"},"answer":"D","type":"choice"},{"n":9,"prompt":"The new material __(9)__ pilots warm and dry.","options":{"A":"kept","B":"has kept","C":"had kept","D":"would have kept"},"answer":"A","type":"choice"},{"n":10,"prompt":"Pilots found __(10)__ difficult to fly in bright sunlight.","options":{"A":"it","B":"too","C":"them","D":"some"},"answer":"A","type":"choice"},{"n":11,"prompt":"Special glasses helped __(11)__ their eyes from strong light.","options":{"A":"warn","B":"suffer","C":"protect","D":"pretend"},"answer":"C","type":"choice"}],"passage":"The bomber jacket began as cold-weather clothing for pilots and later became everyday fashion. Aviator sunglasses were also created for pilots: Bausch & Lomb designed glasses that covered the eye area and protected it from strong sunlight."},{"title":"三、閱讀測驗","questions":[{"n":12,"prompt":"Why is Marlon Brando mentioned?","options":{"A":"He gave T-shirts to sailors.","B":"He helped make the T-shirt fashionable.","C":"He wore them while working on ships.","D":"He designed the first modern T-shirt."},"answer":"B","type":"choice"},{"n":13,"prompt":"Why were sailors given T-shirts?","options":{"A":"To look formal.","B":"To make uniforms smarter.","C":"To replace jackets.","D":"To stay cooler in hot conditions."},"answer":"D","type":"choice"},{"n":14,"prompt":"What was the original purpose of cargo pants?","options":{"A":"To let people carry equipment.","B":"To add warmth.","C":"To make soldiers comfortable.","D":"To help people run faster."},"answer":"A","type":"choice"}],"passage":"Short-sleeved white T-shirts were issued to sailors in 1913 for use in hot ships. Film stars later helped popularize them. Cargo pants first served soldiers who needed extra pockets while keeping their hands free for weapons."},{"title":"四、翻譯填空","questions":[{"n":15,"prompt":"Greg 無意間看到一些過季的時尚雜誌並買下來。\nGreg _____ some old fashion magazines and bought them.","answer":"came across","accepted":[],"type":"text"},{"n":16,"prompt":"Tim 起初是服務生，最終成為這間餐廳的經理。\nTim _____ as a waiter and eventually became the manager.","answer":"started out","accepted":[],"type":"text"}]}]},{"n":3,"title":"When AI Always Takes Your Side","meta":"pp. 18–19 · October 7, 2026","sections":[{"title":"一、字彙","questions":[{"n":1,"prompt":"Ben didn’t see the accident, so he couldn’t _____ any details.","options":{"A":"strip","B":"provide","C":"import","D":"injure"},"answer":"B","type":"choice"},{"n":2,"prompt":"You may not like it, but it’s my _____ opinion.","options":{"A":"honest","B":"military","C":"loose","D":"raw"},"answer":"A","type":"choice"},{"n":3,"prompt":"William _____ the dead batteries with new ones.","options":{"A":"introduced","B":"relaxed","C":"shocked","D":"replaced"},"answer":"D","type":"choice"},{"n":4,"prompt":"I sincerely a_______e for making you upset.","answer":"apologize","accepted":[],"type":"text"},{"n":5,"prompt":"The man called his son in to give him a____e.","answer":"advice","accepted":[],"type":"text"}]},{"title":"二、克漏字","questions":[{"n":6,"prompt":"__(6)__, people generally preferred AI that did not challenge them.","options":{"A":"Ever since","B":"In addition","C":"On the contrary","D":"Regardless of it"},"answer":"B","type":"choice"},{"n":7,"prompt":"This may make users more __(7)__ that they are right.","options":{"A":"extra","B":"original","C":"precious","D":"confident"},"answer":"D","type":"choice"},{"n":8,"prompt":"Over time, this could cause people __(8)__ valuable social skills.","options":{"A":"lose","B":"losing","C":"to lose","D":"that lose"},"answer":"C","type":"choice"},{"n":9,"prompt":"Handling uncomfortable __(9)__ comes from experience.","options":{"A":"statues","B":"palaces","C":"sleeves","D":"situations"},"answer":"D","type":"choice"},{"n":10,"prompt":"AI systems seem __(10)__ not to give difficult truths.","options":{"A":"designed","B":"designing","C":"to design","D":"to have designed"},"answer":"A","type":"choice"}],"passage":"A Stanford study warned that AI chatbots may support users more readily than people do. Users often prefer systems that do not challenge them, but this may reduce willingness to apologize and weaken the social skills that grow from confronting uncomfortable situations."},{"title":"三、翻譯填空","questions":[{"n":11,"prompt":"大多數人會透過網路來搜尋特定主題的資料。\nMost people _____ the Internet for information about a specific topic.","answer":"turn to","accepted":[],"type":"text"},{"n":12,"prompt":"Chris 幾乎對女友說的任何事都百依百順。\nChris tends to _____ almost everything his girlfriend says.","answer":"agree with","accepted":[],"type":"text"},{"n":13,"prompt":"Tina 比較有可能騎機車而不是開車上班。\nTina is _____ go to work by scooter than by car.","answer":"more likely to","accepted":[],"type":"text"},{"n":14,"prompt":"Tom 決定留在家，畢竟他還有作業要完成。\nTom stayed home. _____, he had homework to finish.","answer":"After all","accepted":[],"type":"text"}]}]},{"n":4,"title":"Dealing with Food Delivery","meta":"pp. 22–23 · October 8–9, 2026","sections":[{"title":"一、字彙","questions":[{"n":1,"prompt":"The city tour _____ lunch and an art museum visit.","options":{"A":"introduces","B":"strips","C":"arises","D":"includes"},"answer":"D","type":"choice"},{"n":2,"prompt":"Raising a young child requires a lot of _____ and understanding.","options":{"A":"navy","B":"patience","C":"sleeve","D":"jewel"},"answer":"B","type":"choice"},{"n":3,"prompt":"A kind lady feeds stray cats in a(n) _____ near her apartment.","options":{"A":"alley","B":"pilot","C":"hunger","D":"suffering"},"answer":"A","type":"choice"},{"n":4,"prompt":"Leo felt great _____ when the tiring hike ended.","options":{"A":"situation","B":"relief","C":"advice","D":"angel"},"answer":"B","type":"choice"},{"n":5,"prompt":"The teacher asked David a question, and he replied i__________y.","answer":"immediately","accepted":[],"type":"text"},{"n":6,"prompt":"Any c______r who spends over NT$1,000 gets a gift.","answer":"customer","accepted":[],"type":"text"}]},{"title":"二、文意選填","questions":[{"n":7,"prompt":"Harvey adds food to the __(7)__.","options":{"A":"fee","B":"cart","C":"curry","D":"estimates","E":"realizes"},"answer":"B","type":"choice"},{"n":8,"prompt":"Grace wants a fish __(8)__ and a soda.","options":{"A":"fee","B":"cart","C":"curry","D":"estimates","E":"realizes"},"answer":"C","type":"choice"},{"n":9,"prompt":"They do not have to pay the delivery __(9)__.","options":{"A":"fee","B":"cart","C":"curry","D":"estimates","E":"realizes"},"answer":"A","type":"choice"},{"n":10,"prompt":"Grace __(10)__ there is a problem with the address.","options":{"A":"fee","B":"cart","C":"curry","D":"estimates","E":"realizes"},"answer":"E","type":"choice"},{"n":11,"prompt":"The driver __(11)__ arriving in five minutes.","options":{"A":"fee","B":"cart","C":"curry","D":"estimates","E":"realizes"},"answer":"D","type":"choice"}],"passage":"Harvey r details.","C":"It develops creative writing.","D":"It makes schedules easier to change."},"answer":"A","type":"choice"}],"passage":"A microhabit becomes stronger when attached to an existing routine that acts as a reminder. Habit stacking links several behaviors into a chain. Recording progress helps people see improvement and build confidence."},{"title":"四、翻譯填空","questions":[{"n":15,"prompt":"與其逃避問題，不如盡全力去解決。\n_____ avoiding a problem, do your best to solve it.","answer":"Instead of","accepted":[],"type":"text"},{"n":16,"prompt":"旅程有些小事出差錯，但還是好玩。\nA few things _____ during the trip, but it was still fun.","answer":"went wrong","accepted":[],"type":"text"}]}]}];
const KEY='live26-10-progress-v1';let state={active:1,answers:{},submitted:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
const norm=x=>String(x||'').trim().toLowerCase().replace(/[’]/g,"'").replace(/[.,!?;:]+$/g,'').replace(/\s*;\s*/g,' ').replace(/\s+/g,' ');
const allQuestions=UNITS.flatMap(u=>u.sections.flatMap(s=>s.questions.map(x=>({u:u.n,...x}))));
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateProgress()}
function render(){const nav=document.getElementById('unitNav'),content=document.getElementById('content');nav.innerHTML='';content.innerHTML='';UNITS.forEach(u=>{const b=document.createElement('button');b.className='unit-link';b.dataset.unit=u.n;b.innerHTML='<span class="unit-dot">'+u.n+'</span><span class="unit-name">'+esc(u.title)+'</span>';b.onclick=()=>showUnit(u.n);nav.appendChild(b);const article=document.createElement('article');article.className='unit';article.dataset.unit=u.n;article.innerHTML='<div class="unit-head"><div class="unit-kicker">Test '+u.n+' · Unit '+u.n+'</div><h2>'+esc(u.title)+'</h2><div class="meta">'+esc(u.meta)+'</div></div>'+u.sections.map(sec=>sectionHTML(u,sec)).join('')+'<div class="unit-actions"><button class="btn" data-submit="'+u.n+'">提交本單元</button><button class="btn ghost" data-reset="'+u.n+'">重做</button><span class="score" id="score-'+u.n+'"></span><span class="spacer"></span><button class="btn next" data-next="'+u.n+'">下一單元 →</button></div>';content.appendChild(article)});bind();showUnit(state.active||1,false);restore();updateProgress()}
function sectionHTML(u,sec){return '<section class="section"><div class="section-head"><h3>'+esc(sec.title)+'</h3></div>'+(sec.passage?'<div class="passage">'+esc(sec.passage)+'</div>':'')+'<div class="questions">'+sec.questions.map(x=>questionHTML(u,x)).join('')+'</div></section>'}
function questionHTML(u,x){const name='u'+u.n+'q'+x.n;const key=u.n+'-'+x.n;let input='';if(x.type==='choice'){input='<div class="choices">'+Object.entries(x.options).map(([k,v])=>'<div class="choice"><input type="radio" id="'+name+k+'" name="'+name+'" value="'+k+'"><label for="'+name+k+'"><span class="letter">'+k+'.</span>'+esc(v)+'</label></div>').join('')+'</div>'}else input='<input class="text-answer" autocomplete="off" spellcheck="false" aria-label="Question '+x.n+' answer">';return '<div class="question" data-key="'+key+'"><div class="prompt"><span class="num">'+x.n+'</span>'+esc(x.prompt)+'</div>'+input+'<div class="feedback"></div></div>'}
function bind(){document.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>{state.answers[el.closest('.question').dataset.key]=el.value;save()});document.querySelectorAll('.text-answer').forEach(el=>el.oninput=()=>{state.answers[el.closest('.question').dataset.key]=el.value;save()});document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>submitUnit(+b.dataset.submit));document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>resetUnit(+b.dataset.reset));document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>showUnit(Math.min(14,+b.dataset.next+1)));document.getElementById('continueBtn').onclick=()=>{showUnit(state.active||1);document.querySelector('.layout').scrollIntoView({behavior:'smooth'})}}
function restore(){for(const [key,val] of Object.entries(state.answers||{})){const box=document.querySelector('.question[data-key="'+key+'"]');if(!box)continue;const radio=box.querySelector('input[type=radio][value="'+CSS.escape(val)+'"]');if(radio)radio.checked=true;const text=box.querySelector('.text-answer');if(text)text.value=val}Object.keys(state.submitted||{}).forEach(n=>{if(state.submitted[n])markUnit(+n,false)})}
function answerOK(item,val){if(item.type==='choice')return val===item.answer;const candidates=[item.answer,...(item.accepted||[])].map(norm);return candidates.includes(norm(val))}
function submitUnit(n){state.submitted[n]=true;markUnit(n,true);save()}
function markUnit(n,scroll){const u=UNITS[n-1];let good=0,total=0;u.sections.flatMap(s=>s.questions).forEach(item=>{total++;const box=document.querySelector('.question[data-key="'+n+'-'+item.n+'"]');const val=state.answers[n+'-'+item.n]||'';const ok=answerOK(item,val);if(ok)good++;box.classList.remove('correct','wrong');box.classList.add('submitted',ok?'correct':'wrong');box.querySelectorAll('input').forEach(i=>i.disabled=true);const fb=box.querySelector('.feedback');if(ok)fb.textContent='✓ 正確';else {const shown=item.type==='choice'?item.answer+'. '+item.options[item.answer]:item.answer;fb.textContent='正確答案：'+shown}});document.getElementById('score-'+n).textContent='得分 '+good+' / '+total;document.querySelector('.unit-link[data-unit="'+n+'"]').classList.add('done');if(scroll){toast('本單元已批改：'+good+' / '+total);document.querySelector('.unit[data-unit="'+n+'"] .unit-head').scrollIntoView({behavior:'smooth'})}}
function resetUnit(n){if(!confirm('確定要清除 Unit '+n+' 的作答與分數嗎？'))return;const u=UNITS[n-1];u.sections.flatMap(s=>s.questions).forEach(item=>delete state.answers[n+'-'+item.n]);delete state.submitted[n];const art=document.querySelector('.unit[data-unit="'+n+'"]');art.querySelectorAll('input').forEach(i=>{i.disabled=false;if(i.type==='radio')i.checked=false;else i.value=''});art.querySelectorAll('.question').forEach(x=>x.classList.remove('submitted','correct','wrong'));art.querySelectorAll('.feedback').forEach(x=>x.textContent='');document.getElementById('score-'+n).textContent='';document.querySelector('.unit-link[data-unit="'+n+'"]').classList.remove('done');save();toast('Unit '+n+' 已重設')}
function showUnit(n,scroll=true){state.active=n;document.querySelectorAll('.unit').forEach(x=>x.classList.toggle('active',+x.dataset.unit===n));document.querySelectorAll('.unit-link').forEach(x=>x.classList.toggle('active',+x.dataset.unit===n));save();if(scroll)document.querySelector('.layout').scrollIntoView({behavior:'smooth'})}
function updateProgress(){const answered=allQuestions.filter(x=>norm(state.answers[x.u+'-'+x.n])).length;document.getElementById('progressText').textContent=answered+' / '+allQuestions.length;document.getElementById('progressBar').style.width=(answered/allQuestions.length*100)+'%'}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();</script></body></html>
