ox-shadow:0 0 0 3px rgba(22,129,138,.1)}.feedback{display:none;margin-top:9px;padding:8px 11px;border-radius:9px;font-size:12.5px;font-weight:600}.question.correct .feedback{display:block;background:var(--greenbg);color:var(--green)}.question.wrong .feedback{display:block;background:var(--coral2);color:var(--red)}.question.correct .text-answer{border-color:var(--green);background:var(--greenbg)}.question.wrong .text-answer{border-color:var(--red);background:var(--coral2)}.question.correct .choice input:checked+label{border-color:var(--green);background:var(--greenbg)}.question.wrong .choice input:checked+label{border-color:var(--red);background:var(--coral2)}.question.submitted .choice input[value="__correct__"]+label{border-color:var(--green)}

<script>const UNITS=[{"n":1,"title":"Ali Baba and the 40 Thieves","meta":"pp. 10–13 · September 1–2, 2026","sections":[{"title":"一、字彙","questions":[{"n":1,"prompt":"Mary _____ she wasn’t upset, but she was actually furious.","options":{"A":"injured","B":"pretended","C":"tightened","D":"whistled"},"answer":"B","type":"choice"},{"n":2,"prompt":"After adding sugar to his coffee, Kevin _____ in a little milk.","options":{"A":"interrupted","B":"located","C":"packed","D":"poured"},"answer":"D","type":"choice"},{"n":3,"prompt":"Thomas gave a _____ to indicate that he was ready to continue hiking.","options":{"A":"signal","B":"method","C":"loan","D":"tag"},"answer":"A","type":"choice"},{"n":4,"prompt":"Signs in the national park _____ people to be careful near wild animals.","options":{"A":"load","B":"warn","C":"measure","D":"tease"},"answer":"B","type":"choice"},{"n":5,"prompt":"Some of the j___ls in the museum once belonged to a former queen.","answer":"jewels","accepted":[],"type":"text"},{"n":6,"prompt":"Margaret went to a tailor and asked him to make a s__k dress for her.","answer":"silk","accepted":[],"type":"text"}]},{"title":"二、克漏字","questions":[{"n":7,"prompt":"Ali Baba saw 40 thieves approaching and __(7)__ a tree to hide from them.","options":{"A":"climb","B":"climbed","C":"climbing","D":"that he climbed"},"answer":"B","type":"choice"},{"n":8,"prompt":"__(8)__, the thieves left and Ali Baba tried the magic words himself.","options":{"A":"Later","B":"Instead","C":"Likewise","D":"Otherwise"},"answer":"A","type":"choice"},{"n":9,"prompt":"Ali Baba entered a __(9)__ that had treasure inside.","options":{"A":"mood","B":"career","C":"cave","D":"theory"},"answer":"C","type":"choice"},{"n":10,"prompt":"His __(10)__ brother Cassim insisted on getting more treasure.","options":{"A":"basic","B":"entire","C":"melting","D":"greedy"},"answer":"D","type":"choice"},{"n":11,"prompt":"He became __(11)__ excited by the gold __(11)__ he forgot the magic words.","options":{"A":"too … for","B":"so … that","C":"both … and","D":"either … or"},"answer":"B","type":"choice"}],"passage":"Long ago in a foreign land, Ali Baba was collecting wood in a forest. He saw a group of 40 thieves approaching and climbed a tree to hide. After the thieves entered a hidden cave using the words “Open, sesame,” Ali Baba later entered and took a modest amount of treasure. His greedy brother Cassim went alone, became so excited that he forgot the magic words, and was killed when the thieves returned."},{"title":"三、閱讀測驗","questions":[{"n":12,"prompt":"What is something the leader of the thieves did?","options":{"A":"He concealed his true identity.","B":"He sacrificed his men on purpose.","C":"He escaped without being noticed.","D":"He hosted an event to attract Ali Baba."},"answer":"A","type":"choice"},{"n":13,"prompt":"Which statement about Ali Baba is correct?","options":{"A":"He made a plan with Morgiana.","B":"He ignored Morgiana’s warning.","C":"He was grateful for Morgiana’s help.","D":"He didn’t fully trust Morgiana."},"answer":"C","type":"choice"},{"n":14,"prompt":"What is TRUE about Morgiana based on the passage?","options":{"A":"She broke all the oil jars.","B":"She worked as a servant for Ali Baba.","C":"She killed all the men with a dagger.","D":"She secretly aided the thieves."},"answer":"B","type":"choice"}],"passage":"The thieves realized someone knew their secret. Their leader dressed as an oil seller and asked to stay at Ali Baba’s home. His men hid inside large oil jars. Morgiana, a slave girl, found the men and killed them with boiling oil. The leader later returned disguised as a guest, but Morgiana recognized and killed him. To thank her, Ali Baba gave Morgiana her freedom."},{"title":"四、翻譯填空","questions":[{"n":15,"prompt":"Sandy 太客氣了，所以不好意思計較 Harry 的行為。\nSandy was _____ polite _____ complain about Harry’s behavior.","answer":"too; to","accepted":["too to","too, to"],"type":"text"},{"n":16,"prompt":"一場惡疾讓這位青年藝術家年紀輕輕就英年早逝。\nA terrible disease _____ the young artist _____ at a very early age.","answer":"struck; down","accepted":["struck down"],"type":"text"}]}]},{"n":2,"title":"From Market to Music: Meet Vienna’s Vegetable Orchestra","meta":"pp. 14–15 · September 3, 2026","sections":[{"title":"一、字彙","questions":[{"n":1,"prompt":"The man fried the _____ pieces with some garlic and ginger.","options":{"A":"jewels","B":"prove","C":"pumpkin","D":"warning"},"answer":"C","type":"choice"},{"n":2,"prompt":"William wrote a romantic poem to _____ his love for Julie.","options":{"A":"jewels","B":"prove","C":"pumpkin","D":"warning"},"answer":"B","type":"choice"},{"n":3,"prompt":"The drink has a m__x of flavors, including cream and vanilla.","answer":"mix","accepted":[],"type":"text"},{"n":4,"prompt":"A_______gly, Greg finished two large pizzas by himself.","answer":"Amazingly","accepted":[],"type":"text"}]},{"title":"二、文意選填","questions":[{"n":5,"prompt":"Some friends __(5)__ if vegetables could be played like musical instruments.","options":{"A":"dry","B":"concerts","C":"modern","D":"audience","E":"wondered"},"answer":"E","type":"choice"},{"n":6,"prompt":"Vegetables get __(6)__ quickly, so new instruments are made for every show.","options":{"A":"dry","B":"concerts","C":"modern","D":"audience","E":"wondered"},"answer":"A","type":"choice"},{"n":7,"prompt":"The orchestra’s music is __(7)__ and fun.","options":{"A":"dry","B":"concerts","C":"modern","D":"audience","E":"wondered"},"answer":"C","type":"choice"},{"n":8,"prompt":"The group has played more than 240 __(8)__ worldwide.","options":{"A":"dry","B":"concerts","C":"modern","D":"audience","E":"wondered"},"answer":"B","type":"choice"},{"n":9,"prompt":"They cook soup for the __(9)__ at the end of every show.","options":{"A":"dry","B":"concerts","C":"modern","D":"audience","E":"wondered"},"answer":"D","type":"choice"}],"passage":"The Vienna Vegetable Orchestra has made music with vegetables since 1998. The musicians buy vegetables on the day of each performance, make new instruments for every show, and play a modern combination of styles. After the concert, leftover vegetables become soup for the audience."},{"title":"三、閱讀測驗","questions":[{"n":10,"prompt":"What is the purpose of Fenglin’s snail races?","options":{"A":"To teach about bugs in Taiwan.","B":"To promote the town in a fun way.","C":"To get towns to hold similar events.","D":"To introduce other race events in Hualien."},"answer":"B","type":"choice"},{"n":11,"prompt":"What can we say about Cittaslow according to the passage?","options":{"A":"It was founded two decades ago.","B":"It is an international project.","C":"It was established in Hualien.","D":"It suggested the snail races."},"answer":"B","type":"choice"},{"n":12,"prompt":"Which statement about the snail races is correct?","options":{"A":"They did not take place in 2026.","B":"They started before the 2024 earthquake.","C":"They were inspired by a 2014 event.","D":"They have been held yearly since 2024."},"answer":"D","type":"choice"}],"passage":"The snail races in Hualien’s Fenglin Township celebrate its relaxed “slow town” lifestyle. Fenglin joined the global Cittaslow network in 2014. The annual races began in 2024 to attract visitors after an earthquake affected local travel and tourism. The first snail to crawl from the center of a table to the edge wins."},{"title":"四、翻譯填空","questions":[{"n":13,"prompt":"濕衣服在陽光下很快就乾了。\nThe wet clothes _____ quickly in the sun.","answer":"dried out","accepted":[],"type":"text"},{"n":14,"prompt":"只要努力，就能把一個簡單的想法變成功的生意。\nHard work can _____ a simple idea _____ a successful business.","answer":"turn; into","accepted":["turn into"],"type":"text"}]}]},{"n":3,"title":"A Picasso for 100 Euro","meta":"pp. 16–17 · September 4, 2026","sections":[{"title":"一、字彙","questions":[{"n":1,"prompt":"Most people try to stay _____ to their beliefs, even when it’s hard.","options":{"A":"greedy","B":"youthful","C":"true","D":"visible"},"answer":"C","type":"choice"},{"n":2,"prompt":"Ken is studying to be a(n ___ a financial crisis for companies.","answer":"set off","accepted":[],"type":"text"},{"n":13,"prompt":"John 編了一則有趣的故事來娛樂他的女兒。\nJohn _____ a funny story to entertain his daughter.","answer":"made up","accepted":[],"type":"text"},{"n":14,"prompt":"檢查這張購物清單看是否還有任何缺漏。\n_____ the shopping list to see if anything’s missing.","answer":"Look over","accepted":[],"type":"text"}]}]},{"n":4,"title":"The Wonderful World of Pikmin Bloom","meta":"pp. 22–25 · September 11–12, 2026","sections":[{"title":"一、字彙","questions":[{"n":1,"prompt":"Some people prefer taking _____ alone, while others like having a companion.","options":{"A":"adventure","B":"journeys","C":"jar","D":"worth","E":"casual"},"answer":"B","type":"choice"},{"n":2,"prompt":"It was a(n) _____ meeting, and everyone could express themselves.","options":{"A":"adventure","B":"journeys","C":"jar","D":"worth","E":"casual"},"answer":"E","type":"choice"},{"n":3,"prompt":"James and his brothers pretended they were pirates having a(n) _____.","options":{"A":"adventure","B":"journeys","C":"jar","D":"worth","E":"casual"},"answer":"A","type":"choice"},{"n":4,"prompt":"Dave will eat lunch at a n____y café that serves good sandwiches.","answer":"nearby","accepted":[],"type":"text"},{"n":5,"prompt":"The children happily followed a t___l beside the stream.","answer":"trail","accepted":[],"type":"text"},{"n":6,"prompt":"Laura is an active girl who spends a lot of her time o______s.","answer":"outdoors","accepted":[],"type":"text"}]},{"title":"二、文意選填","questions":[{"n":7,"prompt":"Players collect petals and leave __(7)__ paths on a real-world map.","options":{"A":"join","B":"earn","C":"turn","D":"colorful","E":"ground"},"answer":"D","type":"choice"},{"n":8,"prompt":"After enough steps, you can pull a Pikmin from the __(8)__.","options":{"A":"join","B":"earn","C":"turn","D":"colorful","E":"ground"},"answer":"E","type":"choice"},{"n":9,"prompt":"Fruit can __(9)__ into nectar.","options":{"A":"join","B":"earn","C":"turn","D":"colorful","E  _____ are often difficult to understand.","options":{"A":"jars","B":"terms","C":"concerts","D":"trails"},"answer":"B","type":"choice"},{"n":5,"prompt":"Wendy d_______d good habits as a child.","answer":"developed","accepted":[],"type":"text"},{"n":6,"prompt":"John asked the travel agent for d____ls about a trip to Bali.","answer":"details","accepted":[],"type":"text"}]},{"title":"二、克漏字","questions":[{"n":7,"prompt":"The word catfishing can be __(7)__ the 2010 film Catfish.","options":{"A":"turned into","B":"reminded of","C":"curious about","D":"traced back to"},"answer":"D","type":"choice"},{"n":8,"prompt":"Catfishing has become a serious __(8)__ to personal safety.","options":{"A":"threat","B":"honor","C":"campus","D":"scientist"},"answer":"A","type":"choice"},{"n":9,"prompt":"If strangers __(9)__ money or information, they may be catfish.","options":{"A":"own","B":"prove","C":"request","D":"amaze"},"answer":"C","type":"choice"},{"n":10,"prompt":"Honest people do not need such things __(10)__ to know you.","options":{"A":"to get","B":"that get","C":"so that get","D":"as if getting"},"answer":"A","type":"choice"},{"n":11,"prompt":"__(11)__ AI becomes popular, catfish are harder to spot.","options":{"A":"If","B":"As","C":"Lest","D":"Until"},"answer":"B","type":"choice"}],"passage":"Catfishing means pretending to be someone else online to trick people. The term can be traced to a 2010 documentary. Catfishing threatens privacy and safety. Requests for money or personal information are warning signs, and AI is making fake identities harder to spot."},{"title":"三、閱讀測驗","questions":[{"n":12,"prompt":"What is one sign an online account may not be genuine?","options":{"A":"It gets many messages.","B":"It has too many personal details.","C":"It was created recently.","D":"Its profile photo changes often."},"answer":"C","type":"choice"},{"n":13,"prompt":"What might suggest a new online friend is hiding their identity?","options":{"A":"They avoid phone calls.","B":"They insist on direct speech.","C":"They spend hours online.","D":"They take up hobbies."},"answer":"A","type":"choice"},{"n":14,"prompt":"How can people check someone’s identity?","options":{"A":"Measure reply speed.","B":"Check other sites for their presence.","C":"Look at phone contacts.","D":"Find their home address."},"answer":"B","type":"choice"}],"passage":"Fake profiles can look convincing, but warning signs include few photos, friends, or posts; very recent creation; and no person in the main profile photo. A reluctance to take calls is another clue. Checking for the person on other social platforms may help verify an identity."},{"title":"四、翻譯填空","questions":[{"n":15,"prompt":"結果那家店下午竟然沒開。\nThe store _____ to be closed in the afternoon.","answer":"turned out","accepted":[],"type":"text"},{"n":16,"prompt":"Mary 決定採取行動來強化她的西班牙文能力。\nMary decided to _____ improve her Spanish.","answer":"take steps to","accepted":[],"type":"text"}]}]}];
const KEY='live26-09-progress-v1';let state={active:1,answers:{},submitted:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
const norm=x=>String(x||'').trim().toLowerCase().replace(/[’]/g,"'").replace(/[.,!?;:]+$/g,'').replace(/\s*;\s*/g,' ').replace(/\s+/g,' ');
const allQuestions=UNITS.flatMap(u=>u.sections.flatMap(s=>s.questions.map(x=>({u:u.n,...x}))));
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateProgress()}
function render(){const nav=document.getElementById('unitNav'),content=document.getElementById('content');nav.innerHTML='';content.innerHTML='';UNITS.forEach(u=>{const b=document.createElement('button');b.className='unit-link';b.dataset.unit=u.n;b.innerHTML='<span class="unit-dot">'+u.n+'</span><span class="unit-name">'+esc(u.title)+'</span>';b.onclick=()=>showUnit(u.n);nav.appendChild(b);const article=document.createElement('article');article.className='unit';article.dataset.unit=u.n;article.innerHTML='<div class="unit-head"><div class="unit-kicker">Test '+u.n+' · Unit '+u.n+'</div><h2>'+esc(u.title)+'</h2><div class="meta">'+esc(u.meta)+'</div></div>'+u.sections.map(sec=>sectionHTML(u,sec)).join('')+'<div class="unit-actions"><button class="btn" data-submit="'+u.n+'">提交本單元</button><button class="btn ghost" data-reset="'+u.n+'">重做</button><span class="score" id="score-'+u.n+'"></span><span class="spacer"></span><button class="btn next" data-next="'+u.n+'">下一單元 →</button></div>';content.appendChild(article)});bind();showUnit(state.active||1,false);restore();updateProgress()}
function sectionHTML(u,sec){return '<section class="section"><div class="section-head"><h3>'+esc(sec.title)+'</h3></div>'+(sec.passage?'<div class="passage">'+esc(sec.passage)+'</div>':'')+'<div class="questions">'+sec.questions.map(x=>questionHTML(u,x)).join('')+'</div></section>'}
function questionHTML(u,x){const name='u'+u.n+'q'+x.n;const key=u.n+'-'+x.n;let input='';if(x.type==='choice'){input='<div class="choices">'+Object.entries(x.options).map(([k,v])=>'<div class="choice"><input type="radio" id="'+name+k+'" name="'+name+'" value="'+k+'"><label for="'+name+k+'"><span class="letter">'+k+'.</span>'+esc(v)+'</label></div>').join('')+'</div>'}else input='<input class="text-answer" autocomplete="off" spellcheck="false" aria-label="Question '+x.n+' answer">';return '<div class="question" data-key="'+key+'"><div class="prompt"><span class="num">'+x.n+'</span>'+esc(x.prompt)+'</div>'+input+'<div class="feedback"></div></div>'}
function bind(){document.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>{state.answers[el.closest('.question').dataset.key]=el.value;save()});document.querySelectorAll('.text-answer').forEach(el=>el.oninput=()=>{state.answers[el.closest('.question').dataset.key]=el.value;save()});document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>submitUnit(+b.dataset.submit));document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>resetUnit(+b.dataset.reset));document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>showUnit(Math.min(14,+b.dataset.next+1)));document.getElementById('continueBtn').onclick=()=>{showUnit(state.active||1);document.querySelector('.layout').scrollIntoView({behavior:'smooth'})}}
function restore(){for(const [key,val] of Object.entries(state.answers||{})){const box=document.querySelector('.question[data-key="'+key+'"]');if(!box)continue;const radio=box.querySelector('input[type=radio][value="'+CSS.escape(val)+'"]');if(radio)radio.checked=true;const text=box.querySelector('.text-answer');if(text)text.value=val}Object.keys(state.submitted||{}).forEach(n=>{if(state.submitted[n])markUnit(+n,false)})}
function answerOK(item,val){if(item.type==='choice')return val===item.answer;const candidates=[item.answer,...(item.accepted||[])].map(norm);return candidates.includes(norm(val))}
function submitUnit(n){state.submitted[n]=true;markUnit(n,true);save()}
function markUnit(n,scroll){const u=UNITS[n-1];let good=0,total=0;u.sections.flatMap(s=>s.questions).forEach(item=>{total++;const box=document.querySelector('.question[data-key="'+n+'-'+item.n+'"]');const val=state.answers[n+'-'+item.n]||'';const ok=answerOK(item,val);if(ok)good++;box.classList.remove('correct','wrong');box.classList.add('submitted',ok?'correct':'wrong');box.querySelectorAll('input').forEach(i=>i.disabled=true);const fb=box.querySelector('.feedback');if(ok)fb.textContent='✓ 正確';else {const shown=item.type==='choice'?item.answer+'. '+item.options[item.answer]:item.answer;fb.textContent='正確答案：'+shown}});document.getElementById('score-'+n).textContent='得分 '+good+' / '+total;document.querySelector('.unit-link[data-unit="'+n+'"]').classList.add('done');if(scroll){toast('本單元已批改：'+good+' / '+total);document.querySelector('.unit[data-unit="'+n+'"] .unit-head').scrollIntoView({behavior:'smooth'})}}
function resetUnit(n){if(!confirm('確定要清除 Unit '+n+' 的作答與分數嗎？'))return;const u=UNITS[n-1];u.sections.flatMap(s=>s.questions).forEach(item=>delete state.answers[n+'-'+item.n]);delete state.submitted[n];const art=document.querySelector('.unit[data-unit="'+n+'"]');art.querySelectorAll('input').forEach(i=>{i.disabled=false;if(i.type==='radio')i.checked=false;else i.value=''});art.querySelectorAll('.question').forEach(x=>x.classList.remove('submitted','correct','wrong'));art.querySelectorAll('.feedback').forEach(x=>x.textContent='');document.getElementById('score-'+n).textContent='';document.querySelector('.unit-link[data-unit="'+n+'"]').classList.remove('done');save();toast('Unit '+n+' 已重設')}
function showUnit(n,scroll=true){state.active=n;document.querySelectorAll('.unit').forEach(x=>x.classList.toggle('active',+x.dataset.unit===n));document.querySelectorAll('.unit-link').forEach(x=>x.classList.toggle('active',+x.dataset.unit===n));save();if(scroll)document.querySelector('.layout').scrollIntoView({behavior:'smooth'})}
function updateProgress(){const answered=allQuestions.filter(x=>norm(state.answers[x.u+'-'+x.n])).length;document.getElementById('progressText').textContent=answered+' / '+allQuestions.length;document.getElementById('progressBar').style.width=(answered/allQuestions.length*100)+'%'}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();</script></body></html>
